# App
spring.application.name=${SPRING_APP_NAME}-dev
server.port=${HOST_PORT}
spring.log.level=${SPRING_LOG_LEVEL}

# Security
jwt.secret=${SPRING_JWT_SECRET}
jwt.issuer=${SPRING_JWT_ISSUER}
jwt.public=${SPRING_JWT_PUBLIC}

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.persist-authorization=true

springdoc.openapi.components.security-schemes.bearerAuth.type=http
springdoc.openapi.components.security-schemes.bearerAuth.scheme=bearer
springdoc.openapi.components.security-schemes.bearerAuth.bearerFormat=JWT
springdoc.openapi.security[0].bearerAuth=

springdoc.swagger-ui.urlsPrimaryName=Vet Manager
springdoc.swagger-ui.urls[0].name=Vet Manager
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Appointments
springdoc.swagger-ui.urls[1].url=/appointments/v3/api-docs
springdoc.swagger-ui.urls[2].name=Pets
springdoc.swagger-ui.urls[2].url=/pets/v3/api-docs
springdoc.swagger-ui.urls[3].name=Vets
springdoc.swagger-ui.urls[3].url=/vets/v3/api-docs

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
