# (loads the .env file)
spring.config.import=optional:file:.env[.properties], optional:classpath:metadata.properties

spring.application.name=${SPRING_APP_NAME}
spring.profiles.active=${SPRING_ENV}

# Eureka
eureka.client.service-url.defaultZone=${SPRING_EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# External Microservices
app.service.appointments.base-url=${SERVICE_APPOINTMENTS_BASE_URL}
app.service.pets.base-url=${SERVICE_PETS_BASE_URL}
app.service.vets.base-url=${SERVICE_VETS_BASE_URL}
